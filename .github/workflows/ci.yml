# CI for the cyrs workspace (spec 0001 §17.15).
#
# Matrix: stable/beta × Linux/macOS/Windows. Nightly-only jobs (Miri,
# fuzz) run on the linux-nightly leg. clippy/rustfmt/doc are gates at
# `-D warnings`. cargo-audit and cargo-deny run on every PR.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------
  # Fast signal: fmt + clippy on one leg
  # ---------------------------------------------------------------
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------
  # Grammar <-> recovery.md coverage invariant (spec §4.3, §17.18)
  # ---------------------------------------------------------------
  check-recovery:
    name: check-recovery (spec §4.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo xtask check-recovery
        run: cargo run -p xtask -- check-recovery

  # ---------------------------------------------------------------
  # Non-coupling gate (spec §2.C1, §2.C2)
  # ---------------------------------------------------------------
  non-coupling:
    name: non-coupling gate (spec §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run denylist script
        run: bash scripts/check-noncoupling.sh

  # ---------------------------------------------------------------
  # Test matrix: stable + beta + nightly × linux/macos/windows
  # Nightly is informational only (continue-on-error), per §17.15.
  # ---------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo test
        run: cargo test --workspace --all-features --no-fail-fast

  # ---------------------------------------------------------------
  # Docs: rustdoc passes at -D warnings
  # ---------------------------------------------------------------
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo doc --workspace --all-features --no-deps

  # ---------------------------------------------------------------
  # Coverage gates (spec §17.9)
  # ---------------------------------------------------------------
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  # ---------------------------------------------------------------
  # Supply chain: cargo-audit + cargo-deny (spec §17.16)
  # ---------------------------------------------------------------
  supply-chain:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit,cargo-deny }
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------
  # Nightly: Miri + fuzz (spec §17.12, §17.4)
  # ---------------------------------------------------------------
  miri:
    name: miri (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo miri test
        run: cargo miri test --workspace --all-features
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

  fuzz-smoke:
    name: fuzz smoke (5 min)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # Fuzz targets land in a follow-up; keep this job as a gate.
      - name: cargo fuzz list
        run: cargo fuzz list || echo "(no fuzz targets registered yet)"

  # ---------------------------------------------------------------
  # MSRV check: spec §18 pins 1.94.
  # ---------------------------------------------------------------
  msrv:
    name: msrv (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo check --workspace --all-features
