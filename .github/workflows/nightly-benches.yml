# Nightly heavy-bench runner with a 10% regression gate (spec §17.10,
# bead cy-y6a).
#
# Runs the four at-scale benches added by cy-y6a:
#
#   * bench_large_file          — 10 k-line parse + HIR + diagnose
#   * bench_incremental_edit    — 1 k single-char edits on a 1 k-line file
#   * bench_workspace_fan       — 100-file cross-file diagnostics sweep
#   * bench_agent_throughput    — 10 k JSON round trips against cypher-agent
#
# These are too slow / too resource-hungry for the PR-gate bench workflow
# (.github/workflows/bench.yml), so they run nightly on a scheduled
# trigger and on workflow_dispatch.
#
# Baseline policy
# ---------------
# benches/baselines/nightly.json carries a committed {bench_name ->
# {mean_ns, median_ns}} reference, captured on the initial cy-y6a landing.
# The comparison step fails the job if any bench's current mean_ns
# exceeds its baseline * 1.10. Re-baselining is an explicit operator
# action — see benches/baselines/README.md.
#
# Each bench carries its own *internal* budget gate (p95 wall-clock,
# sub-linear scaling ratio, RSS ceiling, ops/sec floor, p99 ceiling).
# Those gates fail the binary non-zero directly; the criterion-mean
# comparison below catches smaller, sub-budget drift.

name: nightly-benches

on:
  schedule:
    # 05:00 UTC daily — one hour after bench-nightly and fuzz-nightly
    # so shared runners don't contend.
    - cron: "0 5 * * *"
    # 03:00 UTC Sunday — weekly 4-hour RSS soak (cy-wcv).  Scheduled
    # earlier than the daily run so both can execute independently on
    # overlapping weeks without runner contention.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      hours:
        description: "CY_SOAK_HOURS for operator-triggered 24h soak (default 24)"
        required: false
        default: "24"

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly-benches:
    name: nightly-benches (regression gate)
    # Skip when triggered by the weekly soak cron (03:00 Sunday); the
    # soak job below handles that schedule on its own.
    if: github.event.schedule != '0 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "benches -> target"
          key: nightly-benches

      # bench_agent_throughput needs the `cypher-agent` release binary.
      # The bench crate is its own [workspace] so the main workspace
      # target dir is separate; build the binary up front so the bench's
      # own `cargo build` step is a no-op.
      - name: pre-build cypher-agent (release)
        run: cargo build --release -p cypher-agent

      # Run all four heavy benches.  Each bench has `harness = false` +
      # its own `main`, so a non-zero exit from any internal gate
      # (p95, ratio, RSS, ops/sec, p99) fails the step.  `--no-fail-fast`
      # so one bench's failure does not hide another's.
      - name: cargo bench (nightly suite)
        working-directory: benches
        run: |
          set -eo pipefail
          # Run each bench separately so failures are isolated in the logs.
          cargo bench --bench large_file 2>&1 | tee /tmp/bench-large-file.txt
          cargo bench --bench bench_incremental_edit 2>&1 | tee /tmp/bench-incremental-edit.txt
          cargo bench --bench bench_workspace_fan 2>&1 | tee /tmp/bench-workspace-fan.txt
          cargo bench --bench bench_agent_throughput 2>&1 | tee /tmp/bench-agent-throughput.txt

      # Distil criterion's per-bench estimates.json into a flat JSON
      # summary ready for comparison against the committed baseline.
      - name: extract criterion summary
        run: |
          python3 - <<'EOF'
          import json, pathlib

          base = pathlib.Path("benches/target/criterion")
          results = {}
          for est in base.glob("*/new/estimates.json"):
              bench_name = est.parts[-3]
              data = json.loads(est.read_text())
              results[bench_name] = {
                  "mean_ns": data["mean"]["point_estimate"],
                  "median_ns": data["median"]["point_estimate"],
              }
          pathlib.Path("nightly-current.json").write_text(
              json.dumps(dict(sorted(results.items())), indent=2) + "\n"
          )
          print("Current nightly summary:")
          print(pathlib.Path("nightly-current.json").read_text())
          EOF

      # 10% regression gate — any bench whose mean_ns exceeds its
      # committed baseline by more than 10% fails the job.
      - name: compare against committed baseline (10% gate)
        run: |
          python3 - <<'EOF'
          import json, sys, pathlib

          THRESHOLD = 0.10  # spec §17.10 regression gate

          baseline_path = pathlib.Path("benches/baselines/nightly.json")
          current_path  = pathlib.Path("nightly-current.json")
          if not baseline_path.exists():
              print(f"No baseline at {baseline_path}; skipping gate.")
              sys.exit(0)
          baseline = json.loads(baseline_path.read_text())
          current  = json.loads(current_path.read_text())

          regressions = []
          for name, base in baseline.items():
              if name not in current:
                  print(f"  [skip]     {name!r} not found in current run")
                  continue
              base_ns = base["mean_ns"]
              cur_ns  = current[name]["mean_ns"]
              delta   = (cur_ns - base_ns) / base_ns
              marker  = "REGRESSED" if delta > THRESHOLD else "ok"
              print(f"  {marker:10s}  {name}: baseline={base_ns:>12.1f} ns  "
                    f"current={cur_ns:>12.1f} ns  delta={delta:+.1%}")
              if delta > THRESHOLD:
                  regressions.append((name, delta))

          if regressions:
              print()
              print("FAIL: one or more benches regressed by more than 10%:")
              for name, delta in regressions:
                  print(f"  {name}: {delta:+.1%}")
              sys.exit(1)
          print()
          print("PASS: no bench regressed by more than 10%.")
          EOF

      - name: upload criterion HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benches-report-${{ github.run_id }}
          path: |
            benches/target/criterion/
            nightly-current.json
            /tmp/bench-large-file.txt
            /tmp/bench-incremental-edit.txt
            /tmp/bench-workspace-fan.txt
            /tmp/bench-agent-throughput.txt
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # cypher-wasm size gate — spec 0004 §4.2.  Keeps the brotli-compressed
  # artifact ≤ 2 MB so a hosted playground can fetch it on a warm CDN
  # without a loading spinner.  Runs nightly (not on pre-commit) because
  # the wasm toolchain is not universally installed; the `cargo xtask
  # wasm-size` driver itself skips gracefully when a tool is missing.
  # Skipped on the weekly Sunday soak cron so the soak runner is free.
  # ---------------------------------------------------------------------------
  wasm-size:
    name: cypher-wasm size gate (≤ 2 MB brotli)
    if: github.event.schedule != '0 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-size

      - name: install wasm toolchain
        run: |
          cargo install wasm-bindgen-cli --locked
          sudo apt-get update
          sudo apt-get install -y binaryen brotli

      - name: cargo xtask wasm-size
        run: cargo xtask wasm-size

      - name: upload wasm artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypher-wasm-pkg-${{ github.run_id }}
          path: crates/cypher-wasm/pkg/
          if-no-files-found: ignore
          retention-days: 30

  # cy-wcv (spec §11.6 / §17.10): long-horizon RSS soak.
  #
  # Runs weekly (Sunday 03:00 UTC) for 4h — enough to see the steady-state
  # plateau and trigger the slope gate (≥100 KiB/hr over last 8 h — in a
  # 4h run the effective slope window is the post-warmup tail, ~3h).
  #
  # Operator-triggered via `workflow_dispatch` with a custom `hours` input
  # selects longer horizons (typically 24). The workflow timeout is
  # generous enough to cover up to a 24h run (GitHub Actions ceiling is
  # 6h per job on public runners; operators should use a self-hosted
  # runner or split the job for a full 24h).
  soak_4h:
    name: 24h soak (short weekly / long on-demand)
    # Runs on the weekly Sunday cron, or when dispatched manually.  Skipped
    # on the daily 05:00 nightly cron.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    # 4h cron + margin + 24h ceiling for workflow_dispatch. Actions caps
    # public runners at 6h; operators must use a self-hosted runner for
    # the full 24h horizon.
    timeout-minutes: 360
    env:
      # Weekly cron = 4h plateau check.  Operator-triggered = the `hours`
      # input (default 24).  Non-cron non-dispatch (defence in depth)
      # falls back to 4h.
      CY_SOAK_HOURS: >-
        ${{ github.event_name == 'workflow_dispatch'
            && (inputs.hours || '24')
            || '4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "benches -> target"
          key: soak-24h

      - name: cargo bench (incremental_24h soak)
        working-directory: benches
        run: |
          set -eo pipefail
          echo "CY_SOAK_HOURS=${CY_SOAK_HOURS}"
          cargo bench --bench bench_incremental_24h 2>&1 | tee /tmp/bench-incremental-24h.txt

      - name: upload soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-24h-report-${{ github.run_id }}
          path: |
            /tmp/bench-incremental-24h.txt
          if-no-files-found: ignore
          retention-days: 60
