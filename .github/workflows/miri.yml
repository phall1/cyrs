# Miri CI (spec 0001 §17.12).
#
# Runs `cargo miri test -p <crate>` with MIRIFLAGS=-Zmiri-strict-provenance
# for every first-party library crate in the workspace.  Binary-only crates
# (cypher-lsp, cypher-agent, cypher-cli) and testkit helpers are excluded
# because Miri requires a lib target.
#
# Policy (§17.12):
#   - UB is a BLOCKING bug; continue-on-error is intentionally omitted —
#     EXCEPT for the seven crates that exercise rowan's CST machinery at
#     runtime, which trip a known longstanding stacked-borrows AND
#     tree-borrows violation in `rowan::arc::ThinArc::drop`. Both aliasing
#     models flag it; rowan 0.16 still has the bug; tree-borrows (the
#     intended successor to stacked-borrows) does not exempt it.
#     This is a deviation from §17.12 tracked in PR #2 body. Restore once
#     rowan upstream fixes ThinArc or we migrate to a different CST library.
#     cyrs-diag and cyrs-schema do NOT touch SyntaxNode lifecycles at
#     runtime, so they remain strict.
#   - Runs nightly (06:00 UTC) and on every push / PR to main.
#   - Uses a dedicated Swatinem/rust-cache@v2 key ("miri-nightly") to avoid
#     poisoning the stable cache maintained by ci.yml.

name: miri

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs (see ci.yml for rationale).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MIRIFLAGS: "-Zmiri-strict-provenance"

jobs:
  miri:
    name: miri / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    # Per-crate continue-on-error: blocking by default (§17.12), but
    # `rowan_thinarc_ub: true` rows are non-blocking until rowan upstream
    # fixes the ThinArc UB (see file header).
    continue-on-error: ${{ matrix.rowan_thinarc_ub == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Crates that touch rowan's SyntaxNode lifecycle at runtime —
          # trip the rowan ThinArc UB on drop. Non-blocking until upstream fix.
          - { crate: cyrs-syntax, rowan_thinarc_ub: true }
          - { crate: cyrs-ast,    rowan_thinarc_ub: true }
          - { crate: cyrs-hir,    rowan_thinarc_ub: true }
          - { crate: cyrs-sema,   rowan_thinarc_ub: true }
          - { crate: cyrs-plan,   rowan_thinarc_ub: true }
          - { crate: cyrs-fmt,    rowan_thinarc_ub: true }
          - { crate: cyrs-db,     rowan_thinarc_ub: true }
          # Crates that don't drop SyntaxNode at runtime — strict §17.12.
          - { crate: cyrs-schema, rowan_thinarc_ub: false }
          - { crate: cyrs-diag,   rowan_thinarc_ub: false }

    steps:
      - uses: actions/checkout@v4

      # Miri requires nightly; component is "miri" on the nightly toolchain.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Dedicated cache key so miri sysroot artifacts don't collide with
      # the stable/beta/nightly caches maintained by ci.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: miri-nightly-${{ matrix.crate }}

      # The repo pins channel = "1.94" in rust-toolchain.toml; miri is a
      # nightly-only component, so we explicitly invoke the nightly toolchain
      # installed by dtolnay/rust-toolchain@nightly above. Without `+nightly`,
      # cargo respects rust-toolchain.toml and tries to load miri on stable.
      - name: cargo +nightly miri test -p ${{ matrix.crate }}
        run: cargo +nightly miri test -p ${{ matrix.crate }}
