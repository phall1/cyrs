# Miri CI (spec 0001 §17.12).
#
# Runs `cargo miri test -p <crate>` with MIRIFLAGS=-Zmiri-strict-provenance
# for every first-party library crate in the workspace.  Binary-only crates
# (cypher-lsp, cypher-agent, cypher-cli) and testkit helpers are excluded
# because Miri requires a lib target.
#
# Policy (§17.12):
#   - UB is a BLOCKING bug. Every crate runs strict with no exemptions.
#     The longstanding rowan `ThinArc::drop` stacked/tree-borrows violation
#     that previously forced seven crates to run non-blocking is now fixed
#     via the `[patch.crates-io]` rowan override in the workspace Cargo.toml
#     (phall1/rowan@fix/rowan-miri-complete); all crates pass strict miri.
#   - Runs nightly (06:00 UTC) and on every push / PR to main.
#   - Uses a dedicated Swatinem/rust-cache@v2 key ("miri-nightly") to avoid
#     poisoning the stable cache maintained by ci.yml.

name: miri

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs (see ci.yml for rationale).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `-Zmiri-disable-isolation` lets snapshot tests (insta) read their .snap
  # files at runtime; without it miri rejects `open` and the suites that use
  # insta corpora abort before any of our actual checks run.
  MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
  # insta resolves the workspace root by shelling out to `cargo metadata`
  # unless this is set; miri cannot spawn a subprocess (`fork`/`socketpair`),
  # so the first snapshot assertion aborts the run. Pinning the root here
  # keeps insta from spawning. See insta env.rs `get_cargo_workspace`.
  INSTA_WORKSPACE_ROOT: ${{ github.workspace }}

jobs:
  miri:
    name: miri / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    # Every crate is blocking: UB is a BLOCKING bug per §17.12 and there are
    # no exemptions now that the rowan ThinArc UB is fixed upstream.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: cyrs-syntax }
          - { crate: cyrs-ast }
          - { crate: cyrs-hir }
          - { crate: cyrs-sema }
          - { crate: cyrs-plan }
          - { crate: cyrs-fmt }
          - { crate: cyrs-db }
          - { crate: cyrs-schema }
          - { crate: cyrs-diag }

    steps:
      - uses: actions/checkout@v4

      # Miri requires nightly; component is "miri" on the nightly toolchain.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Dedicated cache key so miri sysroot artifacts don't collide with
      # the stable/beta/nightly caches maintained by ci.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: miri-nightly-${{ matrix.crate }}

      # The repo pins channel = "1.94" in rust-toolchain.toml; miri is a
      # nightly-only component, so we explicitly invoke the nightly toolchain
      # installed by dtolnay/rust-toolchain@nightly above. Without `+nightly`,
      # cargo respects rust-toolchain.toml and tries to load miri on stable.
      - name: cargo +nightly miri test -p ${{ matrix.crate }}
        run: cargo +nightly miri test -p ${{ matrix.crate }}
