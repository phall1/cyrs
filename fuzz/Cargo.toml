[package]
name    = "cyrs-fuzz"
version = "0.0.1"
edition = "2024"
publish = false

# This crate is intentionally excluded from the workspace (spec §17.4).
# cargo fuzz manages it as a sub-package; the workspace resolver must not
# pull it in so that `cargo check --workspace` (the PR gate) stays fast.
#
# The empty [workspace] table below declares this as a standalone package,
# preventing Cargo from walking up to the parent workspace and pulling it
# in as a member.
[workspace]

[package.metadata]
cargo-fuzz = true

# Library target — grammar-aware generator + shared fuzz helpers (cy-h07.1).
# `cargo fuzz build` only compiles the bin targets, so the lib is free; its
# unit tests run via `cd fuzz && cargo test --lib`.
[lib]
name = "cyrs_fuzz"
path = "src/lib.rs"

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_formatter"
path = "fuzz_targets/fuzz_formatter.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_sema"
path = "fuzz_targets/fuzz_sema.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_plan"
path = "fuzz_targets/fuzz_plan.rs"
test = false
doc  = false

# Grammar-aware target (cy-h07.1). Uses the generator in `src/generator.rs`
# to synthesise valid Cypher from the fuzz input as an RNG seed, then
# asserts parse + fmt + sema + plan all run without error.
[[bin]]
name  = "fuzz_structured_parse"
path  = "fuzz_targets/fuzz_structured_parse.rs"
test  = false
doc   = false
bench = false

# Differential / roundtrip target (cy-h07). Drives the
# `parse(s) == parse(fmt(s))` invariant (spec §17.3 P17.3.4) on
# arbitrary UTF-8 input. Separate from `fuzz_structured_parse` because
# the oracle here is byte-level and the structural-equality check on
# CST shapes is a first-class assertion, not a side effect.
[[bin]]
name  = "fmt_parse_roundtrip"
path  = "fuzz_targets/fmt_parse_roundtrip.rs"
test  = false
doc   = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
cyrs-syntax = { path = "../crates/cyrs-syntax" }
cyrs-fmt    = { path = "../crates/cyrs-fmt" }
cyrs-hir    = { path = "../crates/cyrs-hir" }
cyrs-sema   = { path = "../crates/cyrs-sema" }
cyrs-diag   = { path = "../crates/cyrs-diag" }
cyrs-plan   = { path = "../crates/cyrs-plan" }

# Deterministic RNG for the grammar-aware generator (cy-h07.1). We pin
# `rand_chacha` directly so the generator's byte output stays stable across
# upstream `rand` version bumps.
rand_core    = { version = "0.6", default-features = false }
rand         = { version = "0.8", default-features = false, features = ["std_rng"] }
rand_chacha  = { version = "0.3", default-features = false }

# Needed by `fuzz_structured_parse` to walk the CST looking for ERROR
# nodes — same version cyrs-syntax uses internally.
rowan        = "0.15"

[profile.release]
debug         = true
codegen-units = 1
lto           = false
opt-level     = 3

# ASan + UBSan are injected by cargo-fuzz via RUSTFLAGS; no extra profile
# knobs needed here (cargo fuzz appends -Zsanitizer=address,undefined).
