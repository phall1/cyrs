# pyproject.toml — `cypher` Python wheel configuration.
# Spec 0004 §6.
#
# The wheel is built by `maturin`; `pip install cypher` after release
# pulls the abi3 wheel matching the caller's {OS, arch}.  One wheel
# covers CPython 3.10 → 3.13 via the stable ABI (abi3).

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "cypher"
# Matches the workspace.package.version pin in the root Cargo.toml; the
# `maturin publish` step in `cy-zgz`'s release playbook asserts the two
# values agree before uploading.
version = "0.0.1"
description = "Python bindings for the Cyrs Cypher / GQL frontend: parser, type-checker, formatter, hover, completion."
readme = "README.md"
license = { text = "Apache-2.0 OR MIT" }
authors = [
    { name = "Patrick Hall", email = "phallsignup@gmail.com" },
]
requires-python = ">=3.10"
# The wheel is a pure `extension-module` + stub; no runtime Python
# dependencies.  The stability & compatibility story is carried by the
# abi3 ABI and the `cypher.pyi` stub (spec 0004 §6.3).
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
    "Topic :: Database",
    "Typing :: Typed",
]
keywords = ["cypher", "gql", "graph", "parser", "lsp"]

[project.urls]
Homepage = "https://github.com/phall1/cyrs"
Repository = "https://github.com/phall1/cyrs"
Issues = "https://github.com/phall1/cyrs/issues"
Changelog = "https://github.com/phall1/cyrs/blob/main/crates/cyrs-py/CHANGELOG.md"

[tool.maturin]
# `python-source = "python"` tells maturin to assemble the wheel from a
# pure-Python sibling directory alongside the Rust extension module.
# The `cypher.pyi` type stub (spec 0004 §6.3) ships there; future pure-
# Python helpers (argparse wrappers, __main__) can land without
# touching Rust.
python-source = "python"
# The extension module's Python-visible name.  Must match the
# `#[pymodule] fn cypher(...)` entry point in `src/lib.rs`.
module-name = "cypher._cypher"
# Required for abi3 wheels — pins a floor Python version so one wheel
# covers 3.10, 3.11, 3.12, 3.13 (spec 0004 §6.2).
features = ["pyo3/extension-module"]
# Strip symbols on release builds — keeps the wheel under the 5 MB
# size gate (spec 0004 §6 acceptance criterion).
strip = true
