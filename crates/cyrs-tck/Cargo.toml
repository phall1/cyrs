[package]
name         = "cyrs-tck"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
readme       = "README.md"
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "openCypher TCK v1 conformance harness for the cyrs frontend (spec 0001 §17.5)."
publish      = false

[lib]
name = "cyrs_tck"

[features]
# Enable the full vendored openCypher TCK corpus under
# `tck/full/` as an extra integration test (`tests/full.rs`).  Off by
# default — the corpus has ~1.3k scenarios and runs against the whole
# parser surface, so it is too slow / too many unsupported features to
# gate on pre-commit.  See crate README + `tck/full/VENDORED.md`.
full-tck = []
# Enable the GQL ISO/IEC 39075:2024 bootstrap corpus under
# `tck/gql-iso-39075/` as an extra integration test
# (`tests/gql_iso.rs`).  Off by default — the bootstrap currently has
# many constructs that the parser cannot yet accept (cy-0hj), so the
# baseline is a rolling snapshot rather than a CI gate.  See
# `tck/gql-iso-39075/README.md`.
gql-iso = []
# Enable the vendored OpenGQL upstream sample corpus under
# `tck/opengql-samples/` as an extra integration test
# (`tests/opengql_samples.rs`).  Off by default — like `gql-iso`, this
# is a rolling parser-acceptance snapshot, not a CI gate (cy-qsze).
# See `tck/opengql-samples/README.md`.
opengql-samples = []

[dependencies]
cyrs-db = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
toml  = { workspace = true }
serde = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
