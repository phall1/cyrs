[package]
name         = "cypher"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
readme       = "README.md"
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "Cypher / GQL frontend — lossless CST, typed AST, HIR, semantic analysis, schema-aware checks, diagnostics, formatter, plan IR."

# ---------------------------------------------------------------------------
# Feature flags — spec 0001 §17.15.
#
# Default pulls in the full library surface (all library sub-crates).
# The three slice features let CI verify that each slice compiles in
# isolation with --no-default-features.  Note: cypher-lsp is a binary
# crate (no library target), so the lsp-only feature exercises the LSP
# hosting layer — cypher-db + cypher-fmt + cypher-diag — without the
# LSP binary wrapper.
# ---------------------------------------------------------------------------
[features]
default = [
    "core",
    "fmt",
    "schema",
]
# core: lexer / parser / AST / HIR / sema / diagnostics / plan / DB
core = [
    "dep:cypher-syntax",
    "dep:cypher-ast",
    "dep:cypher-hir",
    "dep:cypher-sema",
    "dep:cypher-diag",
    "dep:cypher-plan",
    "dep:cypher-db",
]
# lsp-only: the library surface consumed by the LSP binary (cypher-db, diag, fmt)
lsp-only = [
    "core",
    "fmt",
]
# fmt-only: formatter library surface
fmt-only = ["fmt", "core"]
fmt = ["dep:cypher-fmt", "core"]
# schema-only: schema / type-system library surface
schema-only = ["schema", "core"]
schema = ["dep:cypher-schema", "core"]

[dependencies]
cypher-syntax = { workspace = true, optional = true }
cypher-ast    = { workspace = true, optional = true }
cypher-hir    = { workspace = true, optional = true }
cypher-sema   = { workspace = true, optional = true }
cypher-schema = { workspace = true, optional = true }
cypher-diag   = { workspace = true, optional = true }
cypher-plan   = { workspace = true, optional = true }
cypher-fmt    = { workspace = true, optional = true }
cypher-db     = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
