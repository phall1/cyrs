[package]
name         = "cypher-py"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
readme       = "README.md"
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "Python (PyO3) bindings for the Cypher / GQL frontend (cypher-lang-services + cypher-db + cypher-diag + cypher-fmt).  Packaged as a maturin-built abi3 wheel; spec 0004 §6."
publish      = true

# `cdylib` is required by PyO3's `extension-module` feature — the wheel
# is a shared library Python's import machinery dlopens.  Spec 0004 §6.1.
[lib]
crate-type = ["cdylib"]

[dependencies]
cypher-db            = { workspace = true }
cypher-diag          = { workspace = true }
cypher-fmt           = { workspace = true }
cypher-lang-services = { workspace = true }
# cypher-syntax is reachable transitively via cypher-lang-services, but
# the Python boundary converts Python `int` offsets into `TextSize` at
# the edge (mirrors cy-u6r / cy-dh6's cypher-wasm / cypher-ffi pattern).
# Direct dep keeps the conversion explicit at the call site.
cypher-syntax        = { workspace = true }
# Spec 0001 §7 schema provider trait — `schema_set(toml)` delegates to
# `cypher_schema::file::load_from_toml_str` so callers share the exact
# parser the CLI / agent use.
cypher-schema        = { workspace = true }

# PyO3 with the `extension-module` + `abi3-py310` features.
#
# * `extension-module` — ships the cdylib as a Python extension module
#   (no libpython link on most platforms; manylinux-friendly).
# * `abi3-py310` — build once against CPython's stable ABI with 3.10 as
#   the floor.  One wheel covers 3.10, 3.11, 3.12, 3.13 per spec 0004
#   §6.2.  abi3 is REQUIRED by the spec, not an optimisation.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# cypher-py is a thin adapter crate (spec 0004 §2.1).  The workspace
# lint table sets `unsafe_code = forbid`, but PyO3's `#[pymethods]` /
# `#[pymodule]` macros expand to code that calls PyO3-internal `unsafe
# fn`s (argument extraction, PyObject ref_from_ptr, GIL lifecycle), so
# the crate cannot inherit the forbid without spurious build errors.
# We mirror the `cypher-ffi` pattern (spec 0004 §5.4 waiver) at the
# crate level: `unsafe_code = allow` here, with workspace parity lints
# mirrored so the rest of the discipline (missing_docs, unsafe_op_in_
# unsafe_fn) still applies.  No hand-written `unsafe` blocks live in
# this crate — every `unsafe` reference is macro-generated by PyO3.
[lints.rust]
unsafe_code                  = "allow"
unused_must_use              = "deny"
missing_debug_implementations = "warn"
missing_docs                 = "deny"
rust_2018_idioms             = { level = "warn", priority = -1 }
# PyO3 macros call `unsafe fn`s from within generated `unsafe fn`
# bodies; leaving this at the workspace default (`deny`) would require
# wrapping every call site in an `unsafe {}` — but those call sites are
# macro-generated and not writable.  Downgrading to `allow` is the same
# trade-off PyO3's own quickstart docs use.
unsafe_op_in_unsafe_fn       = "allow"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
too_many_lines          = "allow"
similar_names           = "allow"
needless_pass_by_value  = "allow"
return_self_not_must_use = "allow"
todo                    = "warn"
unimplemented           = "warn"
dbg_macro               = "deny"
print_stdout            = "allow"
print_stderr            = "allow"
