[package]
name         = "cyrs-agent"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
readme       = "README.md"
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "Stateless JSON API for Cypher / GQL frontend operations (parse/check/complete/hover/rewrite/...)."

[[bin]]
name = "cypher-agent"
path = "src/main.rs"

[dependencies]
cypher-db            = { workspace = true }
cypher-diag          = { workspace = true }
cypher-fmt           = { workspace = true }
cypher-hir           = { workspace = true }
cypher-lang-services = { workspace = true }
cypher-plan          = { workspace = true, features = ["serde"] }
cypher-schema        = { workspace = true }
cypher-sema          = { workspace = true }
cypher-syntax        = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
anyhow               = { workspace = true }
smol_str             = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
