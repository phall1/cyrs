# ---------------------------------------------------------------------------
# v1 NOT green-tag: these should produce parse/sema errors
# ---------------------------------------------------------------------------

[[scenario]]
name    = "CALL subquery not supported (v1 red)"
tags    = ["@CALL-SUBQUERY"]
query   = "CALL { MATCH (n) RETURN n } RETURN n"
outcome = "error"

[[scenario]]
name    = "LOAD CSV not supported (v1 red)"
tags    = ["@LOAD-CSV"]
query   = "LOAD CSV FROM 'file:///data.csv' AS row RETURN row"
outcome = "error"
