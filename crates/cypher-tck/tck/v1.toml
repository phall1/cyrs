# Vendored v1 TCK scenario fixtures — spec 0001 §17.5
#
# These are hand-written representative scenarios covering the v1 green-tag
# surface. They are NOT a full openCypher TCK download (network is restricted
# and the full corpus would be overkill for v1). Each scenario maps to a
# real TCK scenario class.
#
# Format:
#   [[scenario]]
#   name    = "Human-readable name"
#   tags    = ["@TAG1", "@TAG2"]   # at least one v1 tag required to run
#   query   = "CYPHER SOURCE"
#   outcome = "ok" | "error"       # expected parse outcome
#   # (optional) note = "reason for ignore if #[ignore]'d"

# ---------------------------------------------------------------------------
# @MATCH
# ---------------------------------------------------------------------------

[[scenario]]
name    = "MATCH simple node pattern"
tags    = ["@MATCH"]
query   = "MATCH (n) RETURN n"
outcome = "ok"

[[scenario]]
name    = "MATCH node with label"
tags    = ["@MATCH"]
query   = "MATCH (n:Person) RETURN n"
outcome = "ok"

[[scenario]]
name    = "MATCH node with property"
tags    = ["@MATCH"]
query   = "MATCH (n {name: 'Alice'}) RETURN n"
outcome = "ok"

[[scenario]]
name    = "MATCH relationship pattern"
tags    = ["@MATCH"]
query   = "MATCH (a)-[:KNOWS]->(b) RETURN a, b"
outcome = "ok"

[[scenario]]
name    = "OPTIONAL MATCH"
tags    = ["@MATCH", "@OPTIONAL-MATCH"]
query   = "OPTIONAL MATCH (n:Person) RETURN n"
outcome = "ok"

[[scenario]]
name    = "MATCH unclosed paren is a parse error"
tags    = ["@MATCH"]
query   = "MATCH (n RETURN n"
outcome = "error"

# ---------------------------------------------------------------------------
# @RETURN
# ---------------------------------------------------------------------------

[[scenario]]
name    = "RETURN literal integer"
tags    = ["@RETURN"]
query   = "RETURN 1"
outcome = "ok"

[[scenario]]
name    = "RETURN arithmetic expression"
tags    = ["@RETURN"]
query   = "RETURN 1 + 2"
outcome = "ok"

[[scenario]]
name    = "RETURN multiple projections"
tags    = ["@RETURN"]
query   = "RETURN 1 AS a, 2 AS b"
outcome = "ok"

[[scenario]]
name    = "RETURN DISTINCT"
tags    = ["@RETURN"]
query   = "MATCH (n:Person) RETURN DISTINCT n.name"
outcome = "ok"

[[scenario]]
name    = "RETURN ORDER BY SKIP LIMIT"
tags    = ["@RETURN"]
query   = "MATCH (n:Person) RETURN n ORDER BY n.name SKIP 0 LIMIT 10"
outcome = "ok"

[[scenario]]
name    = "RETURN missing expression is a parse error"
tags    = ["@RETURN"]
query   = "RETURN"
outcome = "error"

# ---------------------------------------------------------------------------
# @WHERE
# ---------------------------------------------------------------------------

[[scenario]]
name    = "WHERE equality predicate"
tags    = ["@WHERE"]
query   = "MATCH (n:Person) WHERE n.name = 'Alice' RETURN n"
outcome = "ok"

[[scenario]]
name    = "WHERE AND predicate"
tags    = ["@WHERE"]
query   = "MATCH (n) WHERE n.age > 21 AND n.active = true RETURN n"
outcome = "ok"

[[scenario]]
name    = "WHERE OR predicate"
tags    = ["@WHERE"]
query   = "MATCH (n) WHERE n.x = 1 OR n.x = 2 RETURN n"
outcome = "ok"

[[scenario]]
name    = "WHERE NOT predicate"
tags    = ["@WHERE"]
query   = "MATCH (n) WHERE NOT n.deleted RETURN n"
outcome = "ok"

[[scenario]]
name    = "WHERE IS NULL"
tags    = ["@WHERE", "@NULL"]
query   = "MATCH (n) WHERE n.name IS NULL RETURN n"
outcome = "ok"

[[scenario]]
name    = "WHERE IS NOT NULL"
tags    = ["@WHERE", "@NULL"]
query   = "MATCH (n) WHERE n.name IS NOT NULL RETURN n"
outcome = "ok"

# ---------------------------------------------------------------------------
# @WITH
# ---------------------------------------------------------------------------

[[scenario]]
name    = "WITH simple projection"
tags    = ["@WITH"]
query   = "MATCH (n:Person) WITH n.name AS name RETURN name"
outcome = "ok"

[[scenario]]
name    = "WITH WHERE filter"
tags    = ["@WITH", "@WHERE"]
query   = "MATCH (n:Person) WITH n WHERE n.age > 21 RETURN n"
outcome = "ok"

[[scenario]]
name    = "WITH ORDER BY LIMIT"
tags    = ["@WITH"]
query   = "MATCH (n:Person) WITH n ORDER BY n.name LIMIT 5 RETURN n"
outcome = "ok"

# ---------------------------------------------------------------------------
# @EXPRESSIONS
# ---------------------------------------------------------------------------

[[scenario]]
name    = "String literal expression"
tags    = ["@EXPRESSIONS", "@STRINGS"]
query   = "RETURN 'hello'"
outcome = "ok"

[[scenario]]
name    = "Boolean literal expression"
tags    = ["@EXPRESSIONS"]
query   = "RETURN true, false"
outcome = "ok"

[[scenario]]
name    = "Null literal expression"
tags    = ["@EXPRESSIONS", "@NULL"]
query   = "RETURN null"
outcome = "ok"

[[scenario]]
name    = "List literal expression"
tags    = ["@EXPRESSIONS", "@LISTS"]
query   = "RETURN [1, 2, 3]"
outcome = "ok"

[[scenario]]
name    = "List indexing expression"
tags    = ["@EXPRESSIONS", "@LISTS"]
query   = "UNWIND [1, 2, 3] AS xs RETURN xs[0]"
outcome = "ok"

[[scenario]]
name    = "Map literal expression"
tags    = ["@EXPRESSIONS", "@MAPS"]
query   = "RETURN {a: 1, b: 'two'}"
outcome = "ok"

# cy-5gh — list comprehensions (spec §19).

[[scenario]]
name    = "List comprehension filter"
tags    = ["@EXPRESSIONS", "@LISTS"]
query   = "RETURN [x IN [1, 2, 3] WHERE x > 1]"
outcome = "ok"

[[scenario]]
name    = "List comprehension map"
tags    = ["@EXPRESSIONS", "@LISTS"]
query   = "RETURN [x IN [1, 2, 3] | x + 1]"
outcome = "ok"

[[scenario]]
name    = "Stdlib size of list"
tags    = ["@EXPRESSIONS", "@LISTS"]
query   = "RETURN size([1, 2, 3])"
outcome = "ok"

