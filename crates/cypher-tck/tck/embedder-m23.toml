# Curated embedder M23 subset — bead cy-emb6, embedder-issue 0006.
#
# Why this file exists
# --------------------
# The embedder migrating off its legacy parser onto cyrs gates an M23
# (~220-feature openCypher) corpus on every PR.  cyrs's own pre-commit
# slice (`tck/v1.toml`) covers the v1 green-tag surface but does not
# pin the broader M23 fundamentals the embedder relies on.
#
# This file is a **starter subset** of M23-relevant scenarios, hand-
# selected to mirror the openCypher TCK 2024.3 corpus vendored under
# `tck/full/`.  Scenarios here all parse cleanly under the current
# cyrs front-end; the embedder is expected to extend this list with
# the actual scenarios its legacy parser passes (it can drop in its
# own `[[scenario]]` blocks following the same shape).
#
# Policy
# ------
# - Scenarios may be ADDED whenever they pass.
# - Scenarios MUST NOT be REMOVED when they regress: a regression here
#   is a parser bug, file a bead and fix the parser.  This file is a
#   ratchet, not a moving target.
# - Same on-disk shape as `v1.toml`: `name`, `tags`, `query`, `outcome`.
#
# Format
# ------
#   [[scenario]]
#   name    = "Human-readable name (matches a TCK Scenario: title)"
#   tags    = ["@M23", "@MATCH"]
#   query   = "CYPHER SOURCE"
#   outcome = "ok" | "error"
#
# Every scenario here carries the `@M23` tag so the harness can filter
# this corpus separately from the v1 slice.

# ---------------------------------------------------------------------------
# clauses/match — Match1..Match9 fundamentals
# ---------------------------------------------------------------------------

