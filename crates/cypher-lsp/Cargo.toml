[package]
name         = "cypher-lsp"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "Language server for Cypher / GQL. Spec 0001 §14."

[lib]
name = "cypher_lsp"
path = "src/lib.rs"

[[bin]]
name = "cypher-lsp"
path = "src/main.rs"

[dependencies]
cypher-db            = { workspace = true }
cypher-diag          = { workspace = true, features = ["lsp"] }
cypher-fmt           = { workspace = true }
cypher-hir           = { workspace = true }
cypher-lang-services = { workspace = true }
cypher-plan          = { workspace = true }
cypher-schema        = { workspace = true }
cypher-sema          = { workspace = true }
cypher-syntax        = { workspace = true }
smol_str      = { workspace = true }
lsp-server    = { workspace = true }
lsp-types     = { workspace = true }
rowan         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json      = { workspace = true }
anyhow          = { workspace = true }
tempfile        = { workspace = true }
# `Connection::memory()` returns a pair of crossbeam channels; the test
# harness owns one side and needs the type in scope to construct a dummy
# sender during teardown (mem::replace trick in Drop).
crossbeam-channel = "0.5"
# (smol_str moved to runtime deps — used by init_options JsonSchema.)

[lints]
workspace = true
