[package]
name         = "cypher-cli"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
readme       = "README.md"
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "Command-line tool for the cyrs Cypher / GQL frontend (parse, format, check, plan, explain)."

[[bin]]
name = "cypher"
path = "src/main.rs"

[dependencies]
cypher-db     = { workspace = true }
cypher-diag   = { workspace = true }
cypher-fmt    = { workspace = true }
# Spec 0002: the `schema load` subcommand drives the TOML loader.
cypher-schema = { workspace = true, features = ["file"] }
# Spec 0003: the `project load` subcommand drives the manifest loader.
cypher-project = { workspace = true }
clap       = { workspace = true }
anyhow     = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
