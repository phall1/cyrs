# Tranche 1 acceptance fixture (cy-o8c, spec 0003).
#
# Three member .cyp files share a single schema.toml so cross-file label
# resolution can be demonstrated end-to-end via `cypher check
# crates/cypher-cli/tests/workspace`.
[project]
name        = "tranche1-fixture"
description = "Shared-schema workspace fixture for cy-o8c tranche 1."

[project.dialect]
default = "GqlAligned"

[project.members]
include = ["samples/*.cyp"]

[project.schema]
path = "schema.toml"
