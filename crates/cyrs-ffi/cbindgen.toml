# `cbindgen` configuration for cyrs-ffi.  Spec 0004 §5.6.
#
# The committed header at `include/cypher.h` is regenerated via
# `cargo xtask cbindgen`; `cargo xtask cbindgen --check` asserts the
# committed file matches a fresh run byte-for-byte and fails the gate on
# drift.  The header ships in every release artifact alongside the
# `cdylib` / `staticlib`.

# Pure C bindings — no `namespace` / `extern "C++"` wrapping.
language = "C"

header = """/* cypher.h — stable C ABI for the Cyrs Cypher / GQL frontend.
 *
 * Generated by `cargo xtask cbindgen`.  Do not edit by hand; regenerate
 * the file by running the xtask target.  See
 * `crates/cyrs-ffi/README.md` for the memory-ownership contract
 * (spec 0004 §5.2) and the ABI stability guarantee (spec 0004 §9.2).
 */"""

# `cypher_` prefix is already baked into every exported symbol name, so
# we don't need cbindgen's `autogen_warning` or `include_guard` auto-
# prefixing to stop symbol collisions in foreign codebases.
include_guard = "CYPHER_FFI_H"
autogen_warning = "/* Generated by cbindgen; regenerate via `cargo xtask cbindgen`. */"
include_version = false
cpp_compat = true
no_includes = false
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
style = "type"
line_length = 100

[parse]
# Only the cyrs-ffi crate's public exports — upstream crates are not
# C-ABI stable and their types do not belong in the header.
parse_deps = false

[defines]
# `inject-panic` is a test-only feature (spec 0004 §5.3 harness).  It
# never ships in release artifacts, so cbindgen emits the declaration
# under a `#ifdef CYPHER_FFI_INJECT_PANIC` guard that embedders can
# leave undefined.
"feature = inject-panic" = "CYPHER_FFI_INJECT_PANIC"

[export]
# Every exported Rust item starts with `Cypher` or `cypher_`, so we
# don't need a global prefix rewrite.  We do strip the default
# `#[repr(C)]`-on-enum warning by pinning the rename rule to leave
# identifiers alone.
item_types = ["functions", "structs", "constants", "enums", "opaque"]
prefix = ""

[export.rename]
# No renames — Rust and C see the same identifier.

[fn]
# Every `#[no_mangle] pub extern "C" fn` becomes a C declaration.  The
# default argument-layout is fine for our single-line prototypes.

[enum]
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"
