[package]
name         = "cyrs-ffi"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
homepage     = { workspace = true }
readme       = "README.md"
categories   = { workspace = true }
keywords     = { workspace = true }
description  = "Stable C ABI over the Cypher / GQL frontend (cypher-lang-services + cypher-db + cypher-diag + cypher-fmt).  Produces a cdylib + staticlib + cbindgen-generated header; spec 0004 §5."
publish      = true

# Produce both a dynamic library (for dlopen / JNI / cgo-link consumers)
# and a static archive (for fat-binary embedders).  Spec 0004 §5.1.
[lib]
name = "cypher_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# `inject-panic` exposes a test-only export that deliberately panics when
# called.  Used by `tests/panic_safety.rs` to exercise the catch_unwind
# boundary (spec 0004 §5.3).  Off by default so it does not ship in
# release artifacts.
inject-panic = []

[dependencies]
cypher-db            = { workspace = true }
cypher-diag          = { workspace = true }
cypher-fmt           = { workspace = true }
cypher-lang-services = { workspace = true }
# cypher-syntax is reachable transitively via cypher-lang-services, but
# the FFI boundary converts JS / foreign u32 offsets into `TextSize` at
# the edge (mirrors cy-u6r's cypher-wasm pattern).  Direct dep keeps
# the conversion explicit at the call site.
cypher-syntax        = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# cypher-ffi is the *only* first-party crate granted a `#![forbid(unsafe_code)]`
# waiver (spec 0004 §5.4).  The opt-out lives inside src/lib.rs; the
# workspace lint table is not inherited here so the forbid does not
# silently fight the crate-local allow.  Every other lint is picked up
# from the workspace table by mirroring the published lint rules
# relevant to a thin-adapter crate.
[lints.rust]
# `unsafe_code = "allow"` — spec 0004 §5.4 crate-local waiver.  Every
# `unsafe` block in this crate carries a `// SAFETY:` comment
# (rust-analyzer house style, spec 0001 §23).
unsafe_code            = "allow"
# Workspace parity — spec 0001 §17.15 / §17.13 carry-overs.
unused_must_use        = "deny"
missing_debug_implementations = "warn"
missing_docs           = "deny"
rust_2018_idioms       = { level = "warn", priority = -1 }
# Guards every `unsafe fn` body with an explicit `unsafe {}` block so
# SAFETY-comment discipline stays visible (spec 0004 §5.4).
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
too_many_lines          = "allow"
similar_names           = "allow"
needless_pass_by_value  = "allow"
return_self_not_must_use = "allow"
# FFI exports take raw pointers; the house style is to thread them
# through helper fns rather than wrapping every call in its own lint
# allow.  Keeping the rest of the pedantic set on preserves parity.
missing_safety_doc      = "allow"
not_unsafe_ptr_arg_deref = "allow"
todo                    = "warn"
unimplemented           = "warn"
dbg_macro               = "deny"
print_stdout            = "allow"
print_stderr            = "allow"
