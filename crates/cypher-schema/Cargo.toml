[package]
name         = "cypher-schema"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
authors      = { workspace = true }
repository   = { workspace = true }
description  = "SchemaProvider trait + supporting types for the Cypher front-end. Spec 0001 §8."

[dependencies]
smol_str  = { workspace = true }
indexmap  = { workspace = true }
serde     = { workspace = true, optional = true }
toml      = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = ["file"]
serde   = ["dep:serde", "indexmap/serde", "smol_str/serde"]
# Spec 0002: TOML schema-file loader / round-trip surface.
# Pulls in `toml`, `thiserror`, and `serde` (for derive).
file    = ["serde", "dep:toml", "dep:thiserror", "smol_str/serde"]

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
