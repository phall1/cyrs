[package]
name    = "cyrs-benches"
version = "0.0.1"
edition = "2024"
publish = false

# This crate is intentionally excluded from the workspace (mirrors the fuzz/
# pattern: spec §17.10). The empty [workspace] table below declares it as a
# standalone package so that `cargo check --workspace` (the PR gate) does not
# pull it in.
[workspace]

[[bench]]
name    = "bench_parse"
harness = false

[[bench]]
name    = "bench_format"
harness = false

[[bench]]
name    = "bench_sema"
harness = false

[[bench]]
name    = "bench_plan"
harness = false

[[bench]]
name    = "bench_incremental"
harness = false

[[bench]]
name    = "bench_lsp_completion"
harness = false

[[bench]]
name    = "large_file"
harness = false

# cy-y6a §17.10: perf-at-scale benches — 1k-line incremental edits,
# 100-doc workspace fan-out, and 10 k-op agent throughput.
[[bench]]
name    = "bench_incremental_edit"
harness = false

[[bench]]
name    = "bench_workspace_fan"
harness = false

[[bench]]
name    = "bench_agent_throughput"
harness = false

# cy-wcv §11.6 / §17.10: 24-hour RSS soak (operator-triggered full run;
# weekly CI soak runs with CY_SOAK_HOURS=4).
[[bench]]
name    = "bench_incremental_24h"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[dependencies]
cypher-syntax  = { path = "../crates/cypher-syntax" }
cypher-fmt     = { path = "../crates/cypher-fmt" }
cypher-hir     = { path = "../crates/cypher-hir" }
cypher-sema    = { path = "../crates/cypher-sema" }
cypher-diag    = { path = "../crates/cypher-diag" }
cypher-plan    = { path = "../crates/cypher-plan" }
cypher-db      = { path = "../crates/cypher-db" }
cypher-lsp     = { path = "../crates/cypher-lsp" }
# cy-y6a: bench_workspace_fan drives `cypher check <dir>` via the cy-o8c
# workspace DB.  We mirror `cypher-cli::check_project` in-process rather
# than spawning the CLI binary to keep measurements subprocess-free.
cypher-project = { path = "../crates/cypher-project" }
# LSP Connection::memory() returns a pair of crossbeam channels; the
# bench harness owns one side to drive requests at the server thread.
lsp-server    = "0.7"
lsp-types     = "0.97"
serde_json    = "1"
# Cross-platform current-RSS sampling (linux /proc/self/statm, macos mach
# task_info, windows GetProcessMemoryInfo). Used by bench_incremental and
# bench_workspace_fan.
memory-stats  = "1.2"
# Bench-only scratch dir for the 100-file workspace-fan fixture.  Nothing
# under it is committed; the tempdir is unlinked when the bench exits.
tempfile      = "3"
