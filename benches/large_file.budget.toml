# bench_large_file — p95 wall-clock budgets in milliseconds (spec §17.10,
# bead cy-y6a.1).  These are *nightly-only* gates; the large-file workload
# is too slow for PR-blocking CI.
#
# Re-baseline protocol:
#   1. Run `cargo bench --bench large_file` from benches/ on a quiet
#      machine and note the three reported p95s.
#   2. Set each field below to measured-p95 × 1.2, rounded up.
#   3. Update the table in the rustdoc atop benches/benches/large_file.rs
#      with the same measured numbers so the two sources stay in sync.
#   4. Document the re-baseline in docs/stability.md § "Performance
#      budgets" if the change is policy-driven (not just noise).
#
# Measured p95:
#   Local (MacBook, release, 2026-04-21):  parse=28.56  hir=57.10  diag=54.00
#   CI    (ubuntu-latest,    2026-05-19):  parse=46.54  hir=87.12  diag=88.08
#
# Budgets below are sized against CI p95 × 1.2 because the gate runs in
# CI; CI p95s are persistently ~1.5-1.6× local on shared GitHub-Actions
# VMs.  See cy-usy for follow-up investigation of the local-vs-CI gap.
parse_ms     = 56
hir_lower_ms = 105
diagnose_ms  = 106
