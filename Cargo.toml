[workspace]
resolver = "3"
members = [
    "crates/cypher-syntax",
    "crates/cypher-ast",
    "crates/cypher-hir",
    "crates/cypher-sema",
    "crates/cypher-schema",
    "crates/cypher-diag",
    "crates/cypher-plan",
    "crates/cypher-fmt",
    "crates/cypher-db",
    "crates/cypher-lsp",
    "crates/cypher-agent",
    "crates/cypher-cli",
    "crates/cypher-tck",
    "crates/cypher-testkit",
    "crates/cypher",
    "xtask",
]
default-members = ["crates/cypher-cli"]

[workspace.package]
version      = "0.0.1"
edition      = "2024"
rust-version = "1.94"
license      = "MIT OR Apache-2.0"
authors      = ["phall"]
repository   = "https://github.com/phallsignup/trench.lang"
description  = "A standalone, domain-free Rust front-end for Cypher / GQL: lexer, recovering parser, lossless CST, typed AST, HIR, schema-aware semantic analysis, formatter, LSP, and agent API."
readme       = "README.md"
keywords     = ["cypher", "gql", "graph", "parser", "lsp"]
categories   = ["parser-implementations", "compilers", "development-tools"]

# ---------------------------------------------------------------------------
# Shared dependency pins. Child crates depend on these via `workspace = true`.
# Versions chosen to match widely-deployed releases; bumps are spec-governed.
# ---------------------------------------------------------------------------

[workspace.dependencies]
# syntax layer
rowan     = "0.15"
logos     = "0.14"
smol_str  = "0.3"
text-size = "1.1"
drop_bomb = "0.1"

# general
anyhow       = "1"
thiserror    = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
indexmap     = { version = "2", features = ["serde"] }
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
once_cell    = "1"

# diagnostics rendering
codespan-reporting = "0.11"

# lsp
lsp-server = "0.7"
lsp-types  = "0.97"

# cli
clap = { version = "4", features = ["derive", "env"] }

# dev / testing
insta           = { version = "1", features = ["yaml", "json", "redactions"] }
proptest        = "1"
criterion       = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"
expect-test    = "1.5"
tempfile       = "3"
assert_cmd     = "2"
predicates     = "3"

# internal
cypher-syntax   = { path = "crates/cypher-syntax" }
cypher-ast      = { path = "crates/cypher-ast" }
cypher-hir      = { path = "crates/cypher-hir" }
cypher-sema     = { path = "crates/cypher-sema" }
cypher-schema   = { path = "crates/cypher-schema" }
cypher-diag     = { path = "crates/cypher-diag" }
cypher-plan     = { path = "crates/cypher-plan" }
cypher-fmt      = { path = "crates/cypher-fmt" }
cypher-db       = { path = "crates/cypher-db" }
cypher-tck      = { path = "crates/cypher-tck" }
cypher-testkit  = { path = "crates/cypher-testkit" }
cypher          = { path = "crates/cypher" }

# ---------------------------------------------------------------------------
# Lints. Spec §17.13 forbids unsafe workspace-wide.
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code            = "forbid"
unused_must_use        = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms       = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# carve-outs consistent with rust-analyzer house style
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
too_many_lines          = "allow"
similar_names           = "allow"
needless_pass_by_value  = "allow"
return_self_not_must_use = "allow"
# stricter than default: catch todos in CI
todo                    = "warn"
unimplemented           = "warn"
dbg_macro               = "deny"
print_stdout            = "allow"  # CLI/agent binaries legitimately print
print_stderr            = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.dev]
debug = "limited"

# Dedicated profile for fuzz targets.
[profile.fuzz]
inherits      = "release"
debug         = true
codegen-units = 1
lto           = false
opt-level     = 3
